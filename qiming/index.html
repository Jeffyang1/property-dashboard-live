<!DOCTYPE html>
<html class="staticrypt-html">

            * { box-sizing: border-box; }
            .staticrypt-html { height: 100%; -webkit-text-size-adjust: 100%; }
            .staticrypt-body { min-height: 100%; margin: 0; background: #1f2937;
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: #111827; }
            .staticrypt-content { min-height: 100vh; min-height: 100dvh; display: flex; align-items: flex-start; justify-content: center;
                padding: max(12vh, 32px) 16px 32px; background: linear-gradient(160deg, #1f2937 0%, #334155 100%); }
            .staticrypt-page { width: 100%; max-width: 400px; }
            .staticrypt-form { background: #fff; border-radius: 18px; padding: 28px 22px 24px; box-shadow: 0 12px 32px rgba(0,0,0,.35); text-align: left; }
            .staticrypt-logo { width: 48px; height: 48px; border-radius: 12px; background: #2563eb; display: flex;
                align-items: center; justify-content: center; margin-bottom: 14px; }
            .staticrypt-logo svg { width: 28px; height: 28px; fill: #fff; }
            .staticrypt-instructions { margin: 0 0 18px; }
            .staticrypt-instructions p { margin: 0; font-size: 15.5px; line-height: 1.45; color: #4b5563; }
            .staticrypt-instructions p.staticrypt-title { font-size: 23px; font-weight: 800; margin: 0 0 6px; line-height: 1.25; color: #111827; }
            .staticrypt-hr { display: none; }
            .staticrypt-password-container { position: relative; margin: 0 0 14px; }
            .staticrypt-form input[type="password"], .staticrypt-form input[type="text"] {
                width: 100%; font-size: 17px; padding: 14px 48px 14px 14px; border: 1.5px solid #d1d5db; border-radius: 12px;
                background: #f9fafb; outline: 0; color: #111827; }
            .staticrypt-form input[type="password"]:focus, .staticrypt-form input[type="text"]:focus { border-color: #2563eb; background: #fff; }
            .staticrypt-toggle-password-visibility { cursor: pointer; height: 22px; width: 22px; opacity: .55; position: absolute;
                right: 14px; top: 50%; transform: translateY(-50%); }
            label.staticrypt-remember { display: flex; align-items: center; gap: 12px; min-height: 44px; margin: 0 0 14px; font-size: 15.5px; color: #374151; }
            .staticrypt-remember input[type="checkbox"] { width: 22px; height: 22px; margin: 0; accent-color: #2563eb; }
            .staticrypt-form .staticrypt-decrypt-button { width: 100%; min-height: 52px; border: 0; border-radius: 12px; font-size: 17px; font-weight: 700;
                color: #fff; background: #2563eb; cursor: pointer; -webkit-appearance: none; appearance: none; }

            .staticrypt-footnote { margin: 16px 0 0; font-size: 13px; color: #6b7280; line-height: 1.4; }
            .hidden { display: none !important; }
            .staticrypt-spinner-container { height: 100vh; display: flex; align-items: center; justify-content: center; background: #1f2937; }
            .staticrypt-spinner { display: inline-block; width: 2rem; height: 2rem; border: .25em solid #9ca3af; border-right-color: transparent;

            @keyframes spinner-border { 100% { transform: rotate(360deg); } }
        </style>
